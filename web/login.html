<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Monk SKUD UNEX</title></head><body class="login"><form id="login" class="card login-card"><h1>Monk SKUD UNEX</h1><p>UNEX 721 Access Control</p><label>Логин<input name="username" value="admin"></label><label>Пароль<input name="password" type="password" value="admin"></label><button>Войти</button><div id="err"></div></form><script>login.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(login))});if(r.ok)location='/';else err.textContent='Неверный логин или пароль';}</script></body></html>
