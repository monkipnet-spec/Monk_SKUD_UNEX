<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css?v=029"><title>Monk SKUD UNEX</title></head><body class="login"><form id="login" class="card login-card"><h1>Monk SKUD UNEX</h1><p>UNEX 721 Access Control</p><label>Логин<input name="username" value="admin"></label><label>Пароль<input name="password" type="password" value="admin"></label><button>Войти</button><div id="err"></div></form><script>function pressButton(e){const b=e.target.closest&&e.target.closest('button,.button');if(!b)return;clearTimeout(b._pt);b.classList.remove('skud-pressed');void b.offsetWidth;b.classList.add('skud-pressed');b._pt=setTimeout(()=>b.classList.remove('skud-pressed'),240)}document.addEventListener('pointerdown',pressButton,true);document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')pressButton(e)},true);login.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(login))});if(r.ok)location='/';else err.textContent='Неверный логин или пароль';}</script></body></html>
