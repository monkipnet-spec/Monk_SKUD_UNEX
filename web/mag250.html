<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Монитор присутствия — MAG250</title>
<link rel="stylesheet" type="text/css" href="/mag250.css?v=0334">
</head>
<body>
<div id="screen">
  <div id="topbar">
    <div id="presentTop" class="topmetric present"><span>НА ОБЪЕКТЕ</span><b id="presentWorkers">0</b></div>

    <div id="clockbox">
      <div id="clock">--:--:--</div>
      <div id="date">--.--.----</div>
    </div>

    <div id="awayTop" class="topmetric away"><span>ВНЕ ОБЪЕКТА</span><b id="awayWorkers">0</b></div>
    <div id="connection" class="connecting"><span class="dot"></span><b>ПОДКЛЮЧЕНИЕ</b></div>
  </div>

  <div id="tablecard">
    <div id="tabletitle"><b>СОТРУДНИКИ</b><span>Обновление 3 сек.</span><em id="updatedAt">Ожидание данных...</em></div>
    <div id="headwrap">
      <table class="workers-table"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"></colgroup>
        <thead><tr><th>СТАТУС</th><th>СОТРУДНИК</th><th>ДОЛЖНОСТЬ</th><th>ОТДЕЛ</th><th>ПРИХОД</th><th>УХОД</th></tr></thead>
      </table>
    </div>
    <div id="fixedWrap">
      <table class="workers-table fixed-table"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"></colgroup>
        <tbody id="fixedWorkers"></tbody>
      </table>
    </div>
    <div id="listScroll">
      <table class="workers-table"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"></colgroup>
        <tbody id="workers"><tr><td colspan="6" class="empty">Загрузка...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script type="text/javascript" src="/mag250.js?v=0334"></script>
</body>
</html>
